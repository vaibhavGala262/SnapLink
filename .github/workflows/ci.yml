name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- Stage 1: Init ---
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # --- Stage 2: Build / Test / Package ---
      - name: Build, test, package
        run: mvn -B -Pci package

      # --- Stage 3: SonarCloud (Maven plugin — Sonar's recommended path for Maven projects) ---
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.organization=vaibhavgala262 -Dsonar.projectKey=vaibhavGala262_SnapLink -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # --- Stage 4: Upload jar artifact ---
      - name: Upload jar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snaplink-jar
          path: target/*.jar
          retention-days: 14

      # --- Stage 5: Deploy to Render (guarded) ---
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
