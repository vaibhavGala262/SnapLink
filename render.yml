services:
  - type: web
    name: url-shortener-app
    env: docker
    repo: https://github.com/vaibhavgala262/Snaplink.git
    plan: free
    envVars:
      - key: DB_HOST
        value: db.iziihasbfieoutotpytl.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DATABASE_USERNAME
        value: postgres
      # DATABASE_PASSWORD: set this key as a secret in the Render dashboard (never commit it)
      - key: SPRING_PROFILES_ACTIVE
        value: lite
    healthCheckPath: /